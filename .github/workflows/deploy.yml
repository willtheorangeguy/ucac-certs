name: Deploy

on:
  push:
    branches: [main]
    # Documentation and its workflows never change what runs on the machine, and a
    # redeploy replaces the machine — which takes any scan in progress with it. Keep
    # this list in step with the paths watched by docs.yml.
    paths-ignore:
      - 'docs/**'
      - 'overrides/**'
      - 'mkdocs.yml'
      - '**.md'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # The same tests CI runs, repeated here so the deploy job can depend on them.
  # ci.yml triggers on the same push, so relying on it alone would be a race: both
  # workflows start at once and nothing stops a failing commit from shipping to the
  # only instance, which holds real staff records.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install application
        run: python -m pip install '.[test]'

      - name: Run tests
        run: python -m pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        env:
          # A deploy token scoped to this app, not a personal org token.
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
