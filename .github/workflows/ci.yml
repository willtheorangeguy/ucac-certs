name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install application
        run: python -m pip install '.[test]'

      # Tests run against tests/fixtures only. Certification scans and scraping
      # happen on the deployed server, never in CI.
      - name: Run tests
        run: python -m pytest
