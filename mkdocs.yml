# Documentation configuration for ucac-certs.
#
# Everything shared — theme, palette, markdown extensions, plugins,
# validation — is inherited from the template repository. This file carries
# only what makes this site *this* project.
#
# Never declare `plugins:` or `markdown_extensions:` here. MkDocs replaces
# lists rather than merging them, so doing so silently drops the entire
# shared configuration.

INHERIT: .mkdocs-shared/shared/mkdocs.base.yml

site_name: UCAC Certifications
site_description: Certification expiry tracking for Aquatic Centre lifeguard staff, with a manager web application, Excel and PDF exports, and email reminders.
site_author: willtheorangeguy

# Must be exact. Material derives canonical links, the sitemap, and instant
# navigation from it; a wrong value breaks search indexing silently.
site_url: https://williamvdg.me/ucac-certs/

repo_url: https://github.com/willtheorangeguy/ucac-certs
repo_name: willtheorangeguy/ucac-certs
edit_uri: edit/main/docs/

copyright: Copyright &copy; willtheorangeguy

# No theme.logo block: the repository has no docs/images/logo.png, so the
# shared configuration falls back to an icon.

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Architecture: architecture.md
  - API: api.md
  - Deployment: deployment.md

  - Development:
      - Testing: testing.md
      - CI/CD: ci-cd.md
      - FAQ: faq.md

  # Changelog and License have no nav entry because this repository has no
  # CHANGELOG.md or LICENSE.md at its root. `check_paths: true` turns a missing
  # include into a build failure, so the pages were deleted rather than stubbed.
  #
  # Contributing, Code of Conduct, and Security are org-level files living in
  # willtheorangeguy/.github, so they are linked rather than included.
  - About:
      - Contributing: https://github.com/willtheorangeguy/.github/blob/main/CONTRIBUTING.md
      - Code of Conduct: https://github.com/willtheorangeguy/.github/blob/main/CODE_OF_CONDUCT.md
      - Security: https://github.com/willtheorangeguy/.github/blob/main/SECURITY.md

# The writing standard ships with the docs but is not a site page, and
# internal/ holds the defect log, which is deliberately not published.
exclude_docs: |
  docs.instructions.md
  internal/
