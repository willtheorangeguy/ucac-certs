[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lss-certification-report"
version = "0.1.0"
description = "Track lifeguard certification expiry against the Lifesaving Society, with a manager web application, Excel and PDF exports, and email reminders."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "openpyxl>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "reportlab>=4.2,<5",
  "requests>=2.32,<3",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "httpx>=0.27,<1"]

[project.scripts]
lss-report = "lss_report.cli:main"
lss-web = "lss_report.web.server:main"

[tool.setuptools.packages.find]
include = ["lss_report*"]

[tool.setuptools.package-data]
lss_report = ["web/schema.sql", "web/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
