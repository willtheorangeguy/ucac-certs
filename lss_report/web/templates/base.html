<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Certifications{% endblock %}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
  <style>
    :root {
      --bg: #f7f9fb; --panel: #ffffff; --ink: #16212c; --muted: #5b6470;
      --line: #d7dee5; --accent: #174a75;
      --expired: #FF6565; --expiring: #FFD13F; --missing: #808080; --error: #FFC7CE;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#11171d; --panel:#18212a; --ink:#e8eef4; --muted:#93a1b0; --line:#2b3945; --accent:#7fb2dd; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink);
      font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    header { background:var(--panel); border-bottom:1px solid var(--line); padding:.75rem 1.25rem;
      display:flex; gap:1.25rem; align-items:center; flex-wrap:wrap; }
    header a { color:var(--ink); text-decoration:none; font-weight:500; }
    header a.active { color:var(--accent); }
    header .spacer { margin-left:auto; color:var(--muted); font-size:.85rem; }
    main { max-width:1200px; margin:0 auto; padding:1.5rem 1.25rem 4rem; }
    h1 { font-size:1.35rem; margin:0 0 1rem; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:1.25rem; margin-bottom:1.25rem; }
    table { border-collapse:collapse; width:100%; font-size:.85rem; }
    th, td { border:1px solid var(--line); padding:.35rem .5rem; text-align:left; }
    th { background:var(--line); font-weight:600; }
    td.cert { text-align:center; font-variant-numeric:tabular-nums; }
    .scroll { overflow-x:auto; }
    .swatch { display:inline-block; padding:.15rem .5rem; border-radius:3px; color:#000; font-size:.8rem; }
    button, .button { background:var(--accent); color:#fff; border:1px solid transparent; border-radius:6px;
      padding:.5rem .9rem; font-family:inherit; font-size:.9rem; line-height:1.5; cursor:pointer;
      text-decoration:none; display:inline-block; vertical-align:middle; }
    button.danger { background:transparent; color:var(--expired); border:1px solid var(--line); }
    input, label { font-size:.9rem; }
    input[type=text], input[type=email], input[type=tel], input[type=date] {
      padding:.45rem .55rem; border:1px solid var(--line); border-radius:6px;
      background:var(--bg); color:var(--ink); width:100%; }
    td.actions { white-space:nowrap; text-align:right; }
    td.actions form { display:inline; }
    .icon-button { background:transparent; color:var(--muted); border:1px solid var(--line);
      border-radius:6px; padding:.35rem .5rem; line-height:1; }
    .icon-button:hover { color:var(--accent); border-color:var(--accent); }
    .icon-button.danger:hover { color:var(--expired); border-color:var(--expired); }
    .icon-button .count { font-size:.75rem; margin-left:.25rem; font-variant-numeric:tabular-nums; }
    input[type=file] { font-size:.9rem; width:100%; padding:.45rem .55rem; border:1px solid var(--line);
      border-radius:6px; background:var(--bg); color:var(--ink); }
    label.stacked { display:block; margin-bottom:.35rem; }
    .file-list { list-style:none; margin:0 0 1.25rem; padding:0; }
    .file-list li { display:flex; align-items:center; gap:.6rem; padding:.4rem 0;
      border-bottom:1px solid var(--line); }
    .file-list a { color:var(--accent); overflow-wrap:anywhere; }
    .file-list form { margin-left:auto; }
    dialog { border:1px solid var(--line); border-radius:8px; background:var(--panel);
      color:var(--ink); padding:1.25rem; width:min(640px, 92vw); }
    dialog::backdrop { background:rgba(0,0,0,.45); }
    dialog h2 { font-size:1rem; margin:0 0 1rem; }
    .dialog-actions { display:flex; gap:.5rem; justify-content:flex-end; margin-top:1.25rem; }
    .fields { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:.75rem; align-items:end; }
    .muted { color:var(--muted); font-size:.85rem; }
    .flash { border-left:3px solid var(--expired); padding:.6rem .8rem; background:var(--panel); margin-bottom:1rem; }
    .ok { border-left-color:#2e9e5b; }
  </style>
</head>
<body>
{% if user %}
<header>
  <a href="/" {% if page=='dashboard' %}class="active"{% endif %}>Overview</a>
  <a href="/staff" {% if page=='staff' %}class="active"{% endif %}>Staff</a>
  <a href="/reminders" {% if page=='reminders' %}class="active"{% endif %}>Reminders</a>
  <a href="/diagnostics" {% if page=='diagnostics' %}class="active"{% endif %}>Diagnostics</a>
  <span class="spacer">{{ user }}</span>
  <form method="post" action="/logout"><button class="danger">Sign out</button></form>
</header>
{% endif %}
<main>{% block content %}{% endblock %}</main>
</body>
</html>
