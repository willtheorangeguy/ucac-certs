app = "lss-certifications"
primary_region = "sea"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  SCAN_HOUR = "6"
  REMINDER_HOUR = "7"

[mounts]
  source = "lss_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # The in-process scheduler needs the machine alive, and a Fly volume attaches to
  # only one machine, so this stays always-on rather than scaling to zero.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  # A second machine would fight over the volume and double-fire the scheduler.
  count = 1
